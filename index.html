<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AchaFácil - Login</title>
  <link rel="stylesheet" href="style.css">
  <!-- Ícones da biblioteca Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="container">
    <!-- Cabeçalho com Logo -->
    <header class="logo-container">
      <h1 class="logo-title">AchaFácil</h1>
      <span class="logo-subtitle">FindHub</span>
    </header>

    <!-- Card de Login -->
    <main class="card">
      <h2 class="card-title">Acesse sua conta</h2>

      <form id="loginForm">
        <!-- Campo de E-mail -->
        <div class="form-group">
          <label for="email" class="form-label">E-MAIL</label>
          <div class="input-wrapper">
            <i data-lucide="mail" class="input-icon"></i>
            <input 
              type="email" 
              id="email" 
              class="form-input" 
              placeholder="seu.email@exemplo.com" 
              required
            >
          </div>
        </div>

        <!-- Campo de Senha -->
        <div class="form-group">
          <label for="senha" class="form-label">SENHA</label>
          <div class="input-wrapper">
            <i data-lucide="lock" class="input-icon"></i>
            <input 
              type="password" 
              id="senha" 
              class="form-input" 
              placeholder="••••••••" 
              required
            >
            <button type="button" class="toggle-password" id="togglePasswordBtn" aria-label="Mostrar/ocultar senha">
              <i data-lucide="eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <!-- Botão de Envio -->
        <button type="submit" class="btn-primary">Entrar</button>
      </form>

      <!-- Link Esqueceu sua senha -->
      <a href="#" class="forgot-password">Esqueceu sua senha?</a>
    </main>
  </div>

  <script src="java.js"></script>
</body>
</html>
