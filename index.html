<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AchaFácil - Acesse sua conta</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="main-container">
    <!-- Logótipo -->
    <div class="logo-container">
      <h1 class="logo-title">AchaFácil</h1>
      <span class="logo-subtitle">FindHub</span>
    </div>

    <!-- Card de Login -->
    <div class="card-login">
      <h2>Acesse sua conta</h2>

      <form>
        <!-- Campo E-mail -->
        <div class="group">
          <label for="gmail">E-MAIL</label>
          <div class="input-wrapper">
            <span class="icon">✉</span>
            <input type="email" id="gmail" placeholder="seu.email@exemplo.com" required>
          </div>
        </div>

        <!-- Campo Senha -->
        <div class="group">
          <label for="senha">SENHA</label>
          <div class="input-wrapper">
            <span class="icon">🔒</span>
            <input type="password" id="senha" placeholder="••••••••" required>
            <span class="icon-eye">👁</span>
          </div>
        </div>

        <!-- Botão Entrar -->
        <button type="submit" class="btn-entrar">Entrar</button>

        <!-- Link Esqueceu a Senha -->
        <a href="#" class="forgot-password">Esqueceu sua senha?</a>
      </form>
    </div>
  </div>

</body>
</html>
