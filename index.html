<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AchaFácil - Acesse sua conta</title>
  <link rel="stylesheet" href="style.css">
  <!-- Fonte moderna Inter do Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Ícones via FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="main-container">
    <!-- Logótipo da marca -->
    <div class="logo-container">
      <h1 class="logo-title">AchaFácil</h1>
      <span class="logo-subtitle">FindHub</span>
    </div>

    <!-- Card de Login -->
    <div class="card-login">
      <h2>Acesse sua conta</h2>

      <form>
        <!-- Campo E-mail -->
        <div class="group">
          <label for="gmail">E-MAIL</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-envelope icon-left"></i>
            <input type="email" id="gmail" placeholder="seu.email@exemplo.com" required>
          </div>
        </div>

        <!-- Campo Senha -->
        <div class="group">
          <label for="senha">SENHA</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock icon-left"></i>
            <input type="password" id="senha" placeholder="••••••••" required>
            <i class="fa-regular fa-eye icon-right"></i>
          </div>
        </div>

        <!-- Botão Entrar -->
        <button type="submit" class="btn-entrar">Entrar</button>

        <!-- Link Esqueceu a Senha -->
        <a href="#" class="forgot-password">Esqueceu sua senha?</a>
      </form>
    </div>
  </div>

</body>
</html>
